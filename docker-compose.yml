services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: paystat-clickhouse
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:?Задайте CLICKHOUSE_DATABASE в .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # Values from .env for docker/clickhouse/init.sh (the names CLICKHOUSE_USER/PASSWORD
      # are taken by the image itself: they create an admin, but a readonly user is needed)
      PAYSTAT_DB: ${CLICKHOUSE_DATABASE}
      PAYSTAT_RO_USER: ${CLICKHOUSE_USER:?Задайте CLICKHOUSE_USER в .env}
      PAYSTAT_RO_PASSWORD: ${CLICKHOUSE_PASSWORD:?Задайте CLICKHOUSE_PASSWORD в .env}
    volumes:
      - ./docker/clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./docker/clickhouse/transactions.sql:/docker/init.sql:ro
      - paystat-ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - paystat-net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paystat-api
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # ClickHouse address inside the docker network. .env holds the address for running from the host.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - paystat-net
    restart: unless-stopped

networks:
  paystat-net:
    name: paystat-net

volumes:
  paystat-ch-data:
